{% extends "base.html" %}{% block title %}Cadastro{% endblock %}
{% block content %}<section class="form-card"><p class="eyebrow">FAÇA PARTE</p><h1>Criar conta</h1><form method="post"><label>Nome completo<input name="name" required maxlength="100"></label><label>E-mail<input type="email" name="email" required maxlength="150"></label><label>Senha (mínimo 8 caracteres)<input type="password" name="password" required minlength="8"></label><button class="button full">Cadastrar</button></form><p>Já possui conta? <a href="{{ url_for('auth.login') }}">Entrar</a></p></section>{% endblock %}
